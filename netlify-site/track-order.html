<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | KASHORIA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="k-site-header"><a class="k-site-brand" href="index.html"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a><nav class="k-site-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a><a href="custom-order.html">Custom</a><a href="wishlist.html">Wishlist ♡</a><a href="cart.html">Cart 🛒</a></nav></header><main class="k-feature-page"><section class="k-panel"><div class="eyebrow">Order updates</div><h1>Track your order</h1><form id="track-form" class="k-form-grid"><div class="k-form-group"><label>Order number</label><input id="tr-order" required placeholder="KSH..."></div><div class="k-form-group"><label>Phone number</label><input id="tr-phone" required pattern="[0-9]{10}" placeholder="10-digit phone"></div><div class="k-form-group full"><button class="k-order-btn">Track Order 📦</button></div></form><div id="track-result"></div></section></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/kashoria-all-features.js"></script><script>const statuses=['NEW','CONFIRMED','PROCESSING','SHIPPED','DELIVERED'];const label={NEW:'Order received',CONFIRMED:'Confirmed',PROCESSING:'Making / Processing',SHIPPED:'Shipped',DELIVERED:'Delivered',CANCELLED:'Cancelled'};async function track(){const order=document.getElementById('tr-order').value.trim(),phone=document.getElementById('tr-phone').value.trim(),box=document.getElementById('track-result');try{const d=await KASHORIA_API_CLIENT.request('/api/orders?order='+encodeURIComponent(order)+'&phone='+encodeURIComponent(phone));const o=d.order,idx=statuses.indexOf(o.order_status);box.innerHTML='<div class="k-track-head"><h2>'+KASHORIA_FEATURES.esc(o.order_number)+'</h2><span>'+KASHORIA_FEATURES.esc(label[o.order_status]||o.order_status)+'</span></div><p>Total '+KASHORIA_FEATURES.money(o.total)+' · Payment '+KASHORIA_FEATURES.esc(o.payment_status)+'</p><div class="k-tracker">'+statuses.map((s,i)=>'<div class="k-track-step '+(i<=idx?'done':'')+'"><span>'+(i<idx?'✓':i===idx?'●':'○')+'</span><b>'+label[s]+'</b></div>').join('')+'</div><div class="k-track-items">'+(o.items||[]).map(x=>'<p><b>'+KASHORIA_FEATURES.esc(x.product_name)+'</b> × '+x.quantity+(x.color?' · '+KASHORIA_FEATURES.esc(x.color):'')+'</p>').join('')+'</div>'+(o.tracking_id?'<p><b>'+KASHORIA_FEATURES.esc(o.courier||'Courier')+':</b> '+KASHORIA_FEATURES.esc(o.tracking_id)+'</p>':'');}catch(e){box.innerHTML='<div class="k-track-empty">'+KASHORIA_FEATURES.esc(e.message||'Order not found')+'</div>';}}document.getElementById('track-form').onsubmit=e=>{e.preventDefault();track()};const q=new URLSearchParams(location.search);if(q.get('order'))document.getElementById('tr-order').value=q.get('order');</script>
<script src="js/kashoria-master-v3.js"></script></body></html>
