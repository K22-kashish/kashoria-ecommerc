<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Crochet Collection | KASHORIA</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head><body>
<header class="k-site-header">
  <a class="k-site-brand" href="index.html" aria-label="KASHORIA Home"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a>
  <nav class="k-site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a><a href="custom-order.html">Custom</a>
    <a href="wishlist.html">Wishlist ♡ <span data-wishlist-count>0</span></a>
    <a href="cart.html">Cart 🛒 <span data-cart-count>0</span></a>
    <a href="login.html">Login</a>
  </nav>
</header>
<section class="k-page-hero"><div class="eyebrow">Handmade collection</div><h1>Shop KASHORIA</h1><p>Little crochet pieces made to add softness, colour and personality to everyday life.</p></section>
<div class="k-shop-toolbar"><input id="shop-search" class="k-search" placeholder="Search by product, gift or colour..."><input id="min-price" class="k-price-filter" type="number" min="0" placeholder="Min ₹"><input id="max-price" class="k-price-filter" type="number" min="0" placeholder="Max ₹"><select id="stock-filter" class="k-select"><option value="all">Availability: All</option><option value="in">In stock</option><option value="new">New arrivals</option><option value="best">Best sellers</option></select><select id="sort-products" class="k-select"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="az">Name: A to Z</option></select></div>
<div id="shop-filters" class="k-filter-pills"></div><div class="k-shop-meta" id="shop-meta"></div><div id="shop-products" class="k-product-grid"></div>
<script src="js/store.js"></script><script src="js/cart.js"></script><script src="js/wishlist.js"></script><script src="js/kashoria-enhancements.js"></script>
<script>
(function(){const products=getKashoriaProducts();let current="all";const label=c=>({all:"All",phonecharms:"Phone Charms",hairaccessories:"Hair Accessories",keychains:"Keychains",bouquets:"Bouquets",bagcharms:"Bag Charms",phonecases:"Phone Cases",flowers:"Flowers & Floral Gifts",homedecor:"Home Decor"}[String(c).toLowerCase().replace(/[^a-z0-9]/g,"")]||c);const norm=v=>String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");const filters=[...new Set(["all",...products.map(p=>p.category)])];document.getElementById("shop-filters").innerHTML=filters.map(c=>`<button data-cat="${c}" class="${norm(c)==="all"?"active":""}">${label(c)}</button>`).join("");document.querySelectorAll("#shop-filters button").forEach(b=>b.onclick=()=>{current=b.dataset.cat;document.querySelectorAll("#shop-filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});["shop-search","min-price","max-price","stock-filter","sort-products"].forEach(id=>document.getElementById(id).addEventListener(id==="stock-filter"||id==="sort-products"?"change":"input",render));const params=new URLSearchParams(location.search);if(params.get("category")){current=params.get("category");const b=[...document.querySelectorAll("#shop-filters button")].find(x=>norm(x.dataset.cat)===norm(current));if(b)b.click()}function render(){let list=products.filter(p=>current==="all"||norm(p.category)===norm(current));const q=document.getElementById("shop-search").value.toLowerCase().trim(),min=Number(document.getElementById("min-price").value)||0,max=Number(document.getElementById("max-price").value)||Infinity,stock=document.getElementById("stock-filter").value;if(q)list=list.filter(p=>(p.name+" "+p.category+" "+(p.color||"")).toLowerCase().includes(q));list=list.filter(p=>Number(p.price)>=min&&Number(p.price)<=max);if(stock==="new")list=list.filter(p=>String(p.badge).toLowerCase().includes("new"));if(stock==="best")list=list.filter(p=>String(p.badge).toLowerCase().includes("best"));if(stock==="in")list=list.filter(p=>p.stock!==0);const sort=document.getElementById("sort-products").value;if(sort==="low")list.sort((a,b)=>a.price-b.price);if(sort==="high")list.sort((a,b)=>b.price-a.price);if(sort==="az")list.sort((a,b)=>a.name.localeCompare(b.name));document.getElementById("shop-meta").textContent=`${list.length} product${list.length===1?"":"s"} · Handmade collection`;document.getElementById("shop-products").innerHTML=list.map(p=>`<article class="k-product-card"><div class="k-product-image"><a href="product.html?product=${encodeURIComponent(p.id)}"><img src="${p.image}" alt="${KASHORIA_FEATURES.esc(p.name)}" loading="lazy"></a>${p.badge?`<span class="k-badge">${KASHORIA_FEATURES.esc(p.badge)}</span>`:""}<button class="k-wish" onclick="toggleWishlist('${p.name.replace(/'/g,"\'")}',${p.price},'${p.image.replace(/'/g,"\'")}',this)">♡</button></div><div class="k-product-body"><h3>${KASHORIA_FEATURES.esc(p.name)}</h3><div class="k-rating">★★★★★ <small>(5.0)</small></div><div class="k-product-price">₹${Number(p.price)||0}</div><div class="k-product-actions"><button class="k-view" onclick="location.href='product.html?product=${encodeURIComponent(p.id)}'">View</button><button class="k-add" onclick="addToCart('${p.name.replace(/'/g,"\'")}',${p.price},'${p.image.replace(/'/g,"\'")}')">Add to Cart</button></div></div></article>`).join("")||`<div class="k-panel" style="grid-column:1/-1;text-align:center;padding:50px">No products found. Try another filter ♡</div>`}render()})();
</script><script src="js/kashoria-all-features.js"></script><script src="js/fix-storefront.js"></script>

<script src="js/config.js"></script><script src="js/kashoria-master-v3.js"></script></body></html>
