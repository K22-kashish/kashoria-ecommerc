<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | KASHORIA</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css">
</head>

<body>
<header class="k-site-header">
  <a class="k-site-brand" href="index.html" aria-label="KASHORIA Home"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a>
  <nav class="k-site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a><a href="custom-order.html">Custom</a>
    <a href="wishlist.html">Wishlist ♡ <span data-wishlist-count>0</span></a>
    <a href="cart.html">Cart 🛒 <span data-cart-count>0</span></a>
    <a href="login.html">Login</a>
  </nav>
</header>

    <div class="auth-container">

        <div class="auth-box">

            <h1>KASHORIA</h1>

            <h2>Create Account</h2>

            <p>Join our handmade family ♡</p>

            <form id="signup-form">

                <input
                    type="text"
                    id="signup-name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="signup-email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script>

<script src="js/kashoria-enhancements.js"></script>
<script src="js/kashoria-all-features.js"></script>
<script src="js/kashoria-master-v3.js"></script></body>

</html>
