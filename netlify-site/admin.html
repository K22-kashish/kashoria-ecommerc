x dashed #eadfd9;border-radius:15px}.k-admin-table{width:100%;overflow:auto}.k-admin-product-row{display:flex;justify-content:space-between;gap:12px;padding:11px;border-bottom:1px solid #eee3de}.k-admin-product-row button{border:1px solid #eadfd9;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}
@media(max-width:700px){.k-admin-grid{grid-template-columns:1fr}.k-admin-search{grid-template-columns:1fr}.k-admin-item-row{grid-template-columns:50px 1fr}.k-admin-item-row>strong{grid-column:2}.k-admin-shell{margin-top:20px;padding:0 10px}.k-admin-card{padding:16px}}
</style>
</head>
<body>
<main class="k-admin-shell">
<section id="admin-login" class="k-admin-card k-admin-login">
<div class="eyebrow">Private store management</div><h1>KASHORIA Admin</h1>
<p class="k-admin-note">Sign in with the admin account created by <code>seed-admin.js</code>.</p>
<form id="admin-login-form"><input id="admin-email" type="email" placeholder="Admin email" autocomplete="username" required><input id="admin-password" type="password" placeholder="Admin password" autocomplete="current-password" required><button type="submit">Login to Dashboard</button></form><div id="admin-login-error" class="k-admin-error"></div>
</section>
<section id="admin-dashboard" class="k-admin-card" hidden>
<div class="k-admin-top"><div><div class="eyebrow">Store management</div><h1>KASHORIA Admin</h1><p id="admin-msg" class="k-admin-note">Loading MySQL data…</p></div><div><button id="refresh-admin">↻ Refresh</button> <button id="logout-admin">Logout</button></div></div>
<div class="k-stat-grid"><div><b id="stat-products">0</b><span>Products</span></div><div><b id="stat-orders">0</b><span>Orders</span></div><div><b id="stat-sales">₹0</b><span>Order value</span></div><div><b id="stat-pending">0</b><span>Open orders</span></div></div>
<h2>Orders saved in MySQL</h2><div class="k-admin-search"><input id="order-search" placeholder="Search order number, name, phone or city…"><button id="clear-order-search" class="k-admin-actions button">Clear</button></div><div id="admin-orders"></div>
<h2>Products</h2><div id="admin-products" class="k-admin-table"></div>
<h2>Custom orders</h2><div id="admin-custom"></div>
<h2>Coupons</h2><form id="coupon-form" class="k-form-grid"><input id="cp-code" placeholder="Code" required><select id="cp-type"><option value="percent">Percent</option><option value="flat">Flat ₹</option></select><input id="cp-value" type="number" min="1" placeholder="Value" required><input id="cp-min" type="number" min="0" placeholder="Minimum order"><input id="cp-label" placeholder="Label"><button class="k-order-btn">Create Coupon</button></form><div id="coupon-list"></div>
</section></main>
<script src="js/config.js"></script><script src="js/api.js"></script>
<script>
(function(){
'use strict';

const api = window.KASHORIA_API_CLIENT;

const $ = id => document.getElementById(id);

const money = n =>
  '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');

const esc = x =>
  String(x ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

let allOrders = [];

/* =========================================================
   LOGIN / LOGOUT
   ========================================================= */

function showLogin(){
  $('admin-login').hidden = false;
  $('admin-dashboard').hidden = true;
}

function showDashboard(){
  $('admin-login').hidden = true;
  $('admin-dashboard').hidden = false;
  load();
}

function logout(){
  localStorage.removeItem('kashoria_token');
  localStorage.removeItem('kashoria_user');

  showLogin();

  $('admin-password').value = '';
}

async function login(e){
  e.preventDefault();

  const err = $('admin-login-error');

  err.textContent = '';

  try{
    const data = await api.request(
      '/api/auth/login',
      {
        method:'POST',
        body:JSON.stringify({
          email:$('admin-email').value.trim(),
          password:$('admin-password').value
        })
      }
    );

    if(data.user?.role !== 'admin'){
      throw new Error(
        'This account is not an admin account.'
      );
    }

    localStorage.setItem(
      'kashoria_token',
      data.token
    );

    localStorage.setItem(
      'kashoria_user',
      JSON.stringify(data.user)
    );

    showDashboard();

  }catch(x){
    err.textContent =
      x.message || 'Login failed';
  }
}

/* =========================================================
   PAYMENT STATUS
   ========================================================= */

async function updatePaymentStatus(
  orderNumber,
  paymentStatus
){
  try{

    await api.request(
      '/api/orders/' +
      encodeURIComponent(orderNumber) +
      '/payment-status',
      {
        method:'PATCH',
        body:JSON.stringify({
          paymentStatus
        })
      }
    );

    await load();

  }catch(e){
    alert(
      e.message ||
      'Could not update payment status.'
    );
  }
}

window.updatePaymentStatus =
  updatePaymentStatus;

/* =========================================================
   ORDER STATUS
   ========================================================= */

async function updateOrderStatus(
  orderNumber,
  status
){
  try{

    await api.request(
      '/api/orders/' +
      encodeURIComponent(orderNumber) +
      '/status',
      {
        method:'PATCH',
        body:JSON.stringify({
          status
        })
      }
    );

    await load();

  }catch(e){
    alert(
      e.message ||
      'Could not update order status.'
    );
  }
}

window.updateOrderStatus =
  updateOrderStatus;

/* =========================================================
   ORDER CARD
   ========================================================= */

function orderCard(o){

  const items =
    Array.isArray(o.items)
      ? o.items
      : [];

  const itemHtml =
    items.length

      ? items.map(i => `

        <div class="k-admin-item-row">

          <img
            src="${esc(
              i.product_image ||
              'images/placeholder.jpg.png'
            )}"
            onerror="
              this.src='images/placeholder.jpg.png'
            "
          >

          <div>

            <b>
              ${esc(
                i.product_name ||
                'Product'
              )}
            </b>

            <div class="k-admin-muted">
              Colour:
              ${esc(
                i.color ||
                'As shown in product image'
              )}
            </div>

            <div class="k-admin-muted">
              Quantity:
              ${Number(i.quantity) || 1}
            </div>

            <div class="k-admin-muted">
              Unit price:
              ${money(i.unit_price)}
            </div>

            ${
              i.customization_note
                ? `
                  <div class="k-admin-muted">
                    Note:
                    ${esc(
                      i.customization_note
                    )}
                  </div>
                `
                : ''
            }

            ${
              i.gift_wrap
                ? `
                  <div class="k-admin-muted">
                    🎁 Gift wrap
                    ${
                      i.gift_message
                        ? ' — ' +
                          esc(
                            i.gift_message
                          )
                        : ''
                    }
                  </div>
                `
                : ''
            }

          </div>

          <strong>
            ${money(i.line_total)}
          </strong>

        </div>

      `).join('')

      : `
        <div class="k-admin-empty">
          No order items found.
        </div>
      `;

  const status =
    o.order_status || 'NEW';

const paymentStatus =
    String(o.payment_status || 'PENDING').toUpperCase();

  const paymentMethod =
    o.payment_method || 'UPI';

  const date =
    o.created_at
      ? new Date(
          o.created_at
        ).toLocaleString('en-IN')
      : '—';

  return `

  <article
    class="k-admin-order-card"
  >

    <!-- ORDER HEADER -->

    <div
      class="k-admin-order-head"
    >

      <div>

        <h3>
          ${esc(o.order_number)}
        </h3>

        <div class="k-admin-muted">
          ${esc(date)}
        </div>

      </div>

      <div>

        <span
          class="k-admin-badge"
        >
          ${esc(status)}
        </span>

        <span
          class="k-admin-badge"
          style="margin-left:5px"
        >
          Payment:
          ${esc(paymentStatus)}
        </span>

      </div>

    </div>


    <!-- CUSTOMER + PAYMENT -->

    <div
      class="k-admin-grid"
    >

      <!-- CUSTOMER -->

      <div
        class="k-admin-section"
      >

        <h4>
          👤 Customer
        </h4>

        <div class="k-admin-line">
          <b>Name:</b>
          ${esc(o.customer_name)}
        </div>

        <div class="k-admin-line">
          <b>Phone:</b>
          ${esc(o.phone)}
        </div>

        <div class="k-admin-line">
          <b>Email:</b>
          ${esc(o.email)}
        </div>

        <div class="k-admin-line">
          <b>Address:</b>
          ${esc(o.address)}
        </div>

        <div class="k-admin-line">
          <b>City:</b>
          ${esc(o.city)}
        </div>

        <div class="k-admin-line">
          <b>Pincode:</b>
          ${esc(o.pincode)}
        </div>

      </div>


      <!-- PAYMENT -->

      <div
        class="k-admin-section"
      >

        <h4>
          💰 Payment & Total
        </h4>

        <div class="k-admin-line">
          <b>Payment method:</b>
          ${esc(paymentMethod)}
        </div>

        <div class="k-admin-line">
          <b>Payment status:</b>
          <strong>
            ${esc(paymentStatus)}
          </strong>
        </div>

        <div class="k-admin-line">
          <b>Subtotal:</b>
          ${money(o.subtotal)}
        </div>

        <div class="k-admin-line">
          <b>Delivery:</b>
          ${
            Number(o.shipping_fee)
              ? money(o.shipping_fee)
              : 'FREE'
          }
        </div>

        <div class="k-admin-line">

          <b>
            Grand total:
          </b>

          <strong>
            ${money(o.total)}
          </strong>

        </div>


        <!-- PAYMENT BUTTON -->

        <div
          class="k-admin-actions"
        >

          ${
            paymentStatus === 'PAID'

              ? `
                <button
                  type="button"
                  disabled
                  style="
                    background:#3f7d5a;
                    cursor:default;
                  "
                >
                  ✓ Payment Received
                </button>
              `

              : `
             <button
  type="button"
  onclick="
    window.updatePaymentStatus(
      '${esc(o.order_number)}',
      'PAID'
    )
  "
  style="
    background:#3f7d5a;
    color:white;
    font-weight:700;
    padding:12px 18px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
  "
>
  ✓ MARK AS PAID
</button>
              `
          }

          ${
            paymentStatus === 'PENDING'

              ? `
                <button
                  type="button"
                  onclick="
                    window.updatePaymentStatus(
                      '${esc(o.order_number)}',
                      'FAILED'
                    )
                  "
                  style="
                    background:#9b5360;
                  "
                >
                  Payment Failed
                </button>
              `

              : ''
          }

        </div>

      </div>

    </div>


    <!-- PRODUCTS -->

    <div
      class="k-admin-section"
    >

      <h4>
        🛍️ Products in this order
      </h4>

      ${itemHtml}

    </div>


    <!-- NOTES -->

    ${
      o.notes
        ? `
          <div
            class="k-admin-section"
          >

            <h4>
              📝 Order Notes
            </h4>

            <div
              class="k-admin-line"
            >
              ${esc(o.notes)}
            </div>

          </div>
        `
        : ''
    }


    <!-- ORDER STATUS -->

    <div
      class="k-admin-actions"
    >

      <label>

        <b>
          Order Status:
        </b>

        <select
          onchange="
            window.updateOrderStatus(
              '${esc(o.order_number)}',
              this.value
            )
          "
        >

          ${
            [
              'NEW',
              'CONFIRMED',
              'PROCESSING',
              'SHIPPED',
              'DELIVERED',
              'CANCELLED'
            ]
              .map(
                x => `
                  <option
                    value="${x}"
                    ${
                      x === status
                        ? 'selected'
                        : ''
                    }
                  >
                    ${x}
                  </option>
                `
              )
              .join('')
          }

        </select>

      </label>

    </div>

  </article>

  `;
}

/* =========================================================
   SEARCH ORDERS
   ========================================================= */

function renderOrders(){

  const q =
    $('order-search')
      .value
      .trim()
      .toLowerCase();

  const filtered =
    allOrders.filter(o =>
      [
        o.order_number,
        o.customer_name,
        o.phone,
        o.city,
        o.email,
        o.pincode
      ].some(
        v =>
          String(v || '')
            .toLowerCase()
            .includes(q)
      )
    );

  $('admin-orders').innerHTML =
    filtered.length

      ? filtered
          .map(orderCard)
          .join('')

      : `
        <div
          class="k-admin-empty"
        >
          No matching orders found.
        </div>
      `;
}

/* =========================================================
   LOAD ADMIN DATA
   ========================================================= */

async function load(){

  try{

    $('admin-msg').textContent =
      'Loading products, orders and MySQL data…';

    const [
      stats,
      ps,
      os,
      cs,
      coupons
    ] = await Promise.all([

      api.request(
        '/api/features/admin/stats'
      ),

      api.request(
        '/api/products?limit=500'
      ),

      api.request(
        '/api/orders/admin/all'
      ),

      api.request(
        '/api/features/custom-orders'
      ),

      api.request(
        '/api/features/coupons'
      )

    ]);

    allOrders =
      os.orders || [];


    /* =====================================================
       DASHBOARD STATISTICS
       ===================================================== */

    $('stat-products').textContent =
      stats.products || 0;

    $('stat-orders').textContent =
      stats.orders || 0;

    $('stat-sales').textContent =
      money(stats.sales);

    $('stat-pending').textContent =
      stats.openOrders || 0;


    $('admin-msg').textContent =
      '✓ Connected. Orders loaded from MySQL.';


    /* =====================================================
       ORDERS
       ===================================================== */

    renderOrders();


    /* =====================================================
       PRODUCTS
       ===================================================== */

    $('admin-products').innerHTML =
      (ps.products || [])
        .map(
          p => `

          <div
            class="k-admin-product-row"
          >

            <div>

              <b>
                ${esc(p.name)}
              </b>

              <div
                class="k-admin-muted"
              >
                ₹${Number(p.price) || 0}
                ·
                ${esc(p.category)}
              </div>

            </div>

            <button
              onclick="
                window.editPrice(
                  '${esc(p.id)}',
                  ${Number(p.price) || 0}
                )
              "
            >
              Edit Price
            </button>

          </div>

        `
        )
        .join('');


    /* =====================================================
       CUSTOM ORDERS
       ===================================================== */

    $('admin-custom').innerHTML =
      (cs.customOrders || [])
        .map(
          o => `

          <div
            class="k-admin-order-card"
          >

            <b>
              #${Number(o.id)}
            </b>

            ·

            ${esc(o.name)}

            ·

            ${esc(o.product_idea)}

            · Qty
            ${Number(o.quantity) || 1}

            <div
              class="k-admin-actions"
            >

              <select
                onchange="
                  window.customStatus(
                    ${Number(o.id)},
                    this.value
                  )
                "
              >

                ${
                  [
                    'NEW',
                    'CONTACTED',
                    'QUOTED',
                    'CONFIRMED',
                    'COMPLETED',
                    'CANCELLED'
                  ]
                    .map(
                      x => `
                        <option
                          ${
                            x === o.status
                              ? 'selected'
                              : ''
                          }
                        >
                          ${x}
                        </option>
                      `
                    )
                    .join('')
                }

              </select>

            </div>

          </div>

        `
        )
        .join('')

      ||

      `
        <div
          class="k-admin-empty"
        >
          No custom orders.
        </div>
      `;


    /* =====================================================
       COUPONS
       ===================================================== */

    $('coupon-list').innerHTML =
      (coupons.coupons || [])
        .map(
          c => `

          <div
            class="k-admin-item-row"
          >

            <div>

              <b>
                ${esc(c.code)}
              </b>

              <div
                class="k-admin-muted"
              >
                ${
                  esc(
                    c.label ||
                    c.type
                  )
                }

                · Used:
                ${Number(c.used_count) || 0}
              </div>

            </div>

          </div>

        `
        )
        .join('')

      ||

      `
        <div
          class="k-admin-empty"
        >
          No coupons.
        </div>
      `;

  }catch(e){

    console.error(
      'ADMIN LOAD ERROR:',
      e
    );

    if(
      e.status === 401 ||
      e.status === 403
    ){

      localStorage.removeItem(
        'kashoria_token'
      );

      showLogin();

      $('admin-login-error').textContent =
        e.message ||
        'Admin login required';

    }else{

      $('admin-msg').textContent =
        e.message ||
        'Could not load admin data.';

    }

  }
}

/* =========================================================
   EDIT PRODUCT PRICE
   ========================================================= */

window.editPrice =
async function(id,current){

  const v =
    prompt(
      'New price for this product',
      current
    );

  if(
    v === null ||
    isNaN(Number(v))
  ){
    return;
  }

  try{

    const old =
      await api.request(
        '/api/products/' +
        encodeURIComponent(id)
      );

    const p =
      old.product;

    let options = [];

    try{

      options =
        typeof p.options_json === 'string'
          ? JSON.parse(
              p.options_json || '[]'
            )
          : (
              p.options_json || []
            );

    }catch(_){}

    await api.request(
      '/api/products/' +
      encodeURIComponent(id),
      {
        method:'PUT',

        body:JSON.stringify({
          ...p,
          price:Number(v),
          options
        })
      }
    );

    await load();

  }catch(e){

    alert(
      e.message ||
      'Could not update price.'
    );

  }
};


/* =========================================================
   CUSTOM ORDER STATUS
   ========================================================= */

window.customStatus =
async function(id,status){

  try{

    await api.request(
      '/api/features/custom-orders/' +
      id,
      {
        method:'PATCH',

        body:JSON.stringify({
          status
        })
      }
    );

    await load();

  }catch(e){

    alert(
      e.message ||
      'Could not update custom order.'
    );

  }
};


/* =========================================================
   EVENTS
   ========================================================= */

$('admin-login-form')
  .addEventListener(
    'submit',
    login
  );

$('logout-admin')
  .addEventListener(
    'click',
    logout
  );

$('refresh-admin')
  .addEventListener(
    'click',
    load
  );

$('order-search')
  .addEventListener(
    'input',
    renderOrders
  );

$('clear-order-search')
  .addEventListener(
    'click',
    () => {

      $('order-search').value = '';

      renderOrders();

    }
  );


/* =========================================================
   CREATE COUPON
   ========================================================= */

$('coupon-form')
  .addEventListener(
    'submit',
    async e => {

      e.preventDefault();

      try{

        await api.request(
          '/api/features/coupons',
          {
            method:'POST',

            body:JSON.stringify({

              code:
                $('cp-code')
                  .value
                  .trim()
                  .toUpperCase(),

              type:
                $('cp-type').value,

              value:
                Number(
                  $('cp-value').value
                ),

              minOrder:
                Number(
                  $('cp-min').value
                ) || 0,

              label:
                $('cp-label').value.trim()

            })
          }
        );

        e.target.reset();

        await load();

      }catch(err){

        alert(
