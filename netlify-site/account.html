<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | KASHORIA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="k-site-header">
  <a class="k-site-brand" href="index.html" aria-label="KASHORIA Home"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a>
  <nav class="k-site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a><a href="custom-order.html">Custom</a>
    <a href="wishlist.html">Wishlist ♡ <span data-wishlist-count>0</span></a>
    <a href="cart.html">Cart 🛒 <span data-cart-count>0</span></a>
    <a href="login.html">Login</a>
  </nav>
</header><main class="k-account"><div class="k-account-card" id="account-box"></div></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/kashoria-enhancements.js"></script><script>const u=JSON.parse(localStorage.getItem("kashoria_current_user")||"null"),box=document.getElementById("account-box");async function load(){if(!u||!localStorage.getItem('kashoria_token')){box.innerHTML="<h1>Please sign in</h1><p>You need an account to view this page.</p><a class='k-primary-btn' href='login.html'>Sign In</a>";return;}try{const [me,od]=await Promise.all([KASHORIA_API_CLIENT.request('/api/auth/me'),KASHORIA_API_CLIENT.request('/api/orders/mine')]);const user=me.user,orders=od.orders||[];localStorage.setItem('kashoria_current_user',JSON.stringify(user));box.innerHTML=`<div class='eyebrow'>My account</div><h1>Hello, ${kashoriaEscape(user.name)} ♡</h1><p>${kashoriaEscape(user.email)}</p><h2 style='margin-top:25px'>My orders</h2>${orders.length?orders.map(o=>`<div class='k-panel' style='margin:10px 0'><b>${o.order_number}</b> · ₹${o.total}<br><small>${new Date(o.created_at).toLocaleString("en-IN")} · ${o.order_status}</small></div>`).join(""):"<p>No orders yet.</p>"}<button id='logout'>Log out</button>`;document.getElementById("logout").onclick=()=>{localStorage.removeItem("kashoria_current_user");localStorage.removeItem("kashoria_token");location.href="login.html";};}catch(e){box.innerHTML='<h1>Account</h1><p>'+kashoriaEscape(e.message)+'</p><button id="logout">Log out</button>';document.getElementById('logout').onclick=()=>{localStorage.clear();location.href='login.html';};}}load();</script><script src="js/kashoria-all-features.js"></script>
<script src="js/kashoria-master-v3.js"></script></body></html>
