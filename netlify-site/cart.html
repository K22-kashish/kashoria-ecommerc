<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | KASHORIA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></head><body>
<header class="k-site-header"><a class="k-site-brand" href="index.html"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a><nav class="k-site-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a><a href="custom-order.html">Custom</a><a href="wishlist.html">Wishlist ♡ <span data-wishlist-count>0</span></a><a href="cart.html">Cart 🛒 <span data-cart-count>0</span></a><a href="login.html">Login</a></nav></header>
<section class="k-page-hero"><div class="eyebrow">Your favourites</div><h1>Shopping Cart</h1><p>Review colours, customisation and gift options before checkout.</p></section>
<main class="k-cart-page"><div class="k-cart-layout"><section class="k-panel"><div id="full-cart"></div></section><aside class="k-panel k-summary-sticky"><h2>Order Summary</h2><div class="k-free-progress" id="cart-progress"></div><div class="k-summary-line"><span>Subtotal</span><strong id="cart-subtotal">₹0</strong></div><div class="k-summary-line"><span>Discount</span><strong id="cart-discount">₹0</strong></div><div class="k-summary-line"><span>Gift wrapping</span><strong id="cart-giftwrap">₹0</strong></div><div class="k-summary-line"><span>Delivery</span><strong id="cart-shipping">₹0</strong></div><div class="k-summary-total"><span>Total</span><strong id="cart-total">₹0</strong></div><div class="k-coupon"><input id="coupon" placeholder="Coupon code"><button id="apply-coupon">Apply</button></div><p id="coupon-message" class="k-mini-note"></p><a id="checkout-link" href="checkout.html" class="k-primary-btn" style="width:100%;margin-top:12px">Proceed to Checkout</a><a href="gift-builder.html" class="k-secondary-btn" style="width:100%;margin-top:9px">🎁 Build a Gift</a></aside></div></main>
<script src="js/store.js"></script><script src="js/cart.js"></script><script src="js/wishlist.js"></script><script src="js/kashoria-enhancements.js"></script><script src="js/kashoria-all-features.js"></script>
<script>
(function(){const cfg=KASHORIA_CONFIG;let discount=Number(sessionStorage.getItem('kashoria_discount')||0);let coupon=sessionStorage.getItem('kashoria_coupon')||'';const money=window.KASHORIA_FEATURES.money;function render(){const c=JSON.parse(localStorage.getItem('cart')||'[]'),box=document.getElementById('full-cart');if(!c.length){box.innerHTML='<div class="k-empty"><div class="k-empty-icon">♡</div><h2>Your cart is empty</h2><p>Find something handmade for yourself or someone you love.</p><a href="shop.html" class="k-primary-btn">Shop Collection</a></div>';}else{box.innerHTML=c.map((p,i)=>{const categoryLabel=p.category?String(p.category).replace(/[-_]/g,' ').replace(/\b\w/g,m=>m.toUpperCase()):'';const meta=[categoryLabel?'🗂️ Category: '+categoryLabel:'',p.color?'🎨 Colour: '+p.color:'',p.note?'✏️ Note: '+p.note:'',p.giftWrap?'🎁 Gift wrapping +₹40':'',p.giftMessage?'💌 Gift message: '+p.giftMessage:''].filter(Boolean).map(x=>'<div class="cart-meta">'+window.KASHORIA_FEATURES.esc(x)+'</div>').join('');return '<div class="k-cart-row"><img src="'+window.KASHORIA_FEATURES.esc(p.image)+'" alt="'+window.KASHORIA_FEATURES.esc(p.name)+'"><div><h3>'+window.KASHORIA_FEATURES.esc(p.name)+'</h3><strong>'+money(p.price)+'</strong>'+meta+(p.referenceImage?'<div class="cart-meta">📷 Reference photo attached</div>':'')+'<div class="k-cart-actions"><button onclick="changeQuantity('+i+',-1)">−</button><span>'+p.quantity+'</span><button onclick="changeQuantity('+i+',1)">+</button><button onclick="saveForLater('+i+')" style="width:auto;padding:0 9px">♡ Save for later</button><button onclick="removeFromCart('+i+')" style="width:auto;padding:0 9px">Remove</button></div></div><strong>'+money((Number(p.price)||0)*(Number(p.quantity)||1))+'</strong></div>';}).join('');}const t=kashoriaCartTotals(c,discount);document.getElementById('cart-subtotal').textContent=money(t.subtotal);document.getElementById('cart-giftwrap').textContent=t.giftWrap?money(t.giftWrap):money(0);document.getElementById('cart-discount').textContent=t.discount?'-'+money(t.discount):money(0);document.getElementById('cart-shipping').textContent=t.shipping?money(t.shipping):'FREE';document.getElementById('cart-total').textContent=money(t.total);document.getElementById('cart-progress').innerHTML=t.subtotal>=cfg.freeShippingAt?'🎉 Free delivery unlocked':'Add '+money(cfg.freeShippingAt-t.subtotal)+' more for <b>FREE DELIVERY</b>';document.getElementById('checkout-link').style.pointerEvents=c.length?'auto':'none';document.getElementById('checkout-link').style.opacity=c.length?'1':'.5';}
document.getElementById('apply-coupon').onclick=function(){const c=JSON.parse(localStorage.getItem('cart')||'[]'),sub=c.reduce((s,p)=>s+(Number(p.price)||0)*(Number(p.quantity)||1),0),r=kashoriaCoupon(document.getElementById('coupon').value,sub);discount=r.ok?r.discount:0;coupon=r.ok?document.getElementById('coupon').value.trim().toUpperCase():'';sessionStorage.setItem('kashoria_discount',discount);sessionStorage.setItem('kashoria_coupon',coupon);document.getElementById('coupon-message').textContent=r.message;render();};
window.saveForLater=function(i){const c=JSON.parse(localStorage.getItem('cart')||'[]'),w=JSON.parse(localStorage.getItem('wishlist')||'[]');if(!c[i])return;const p=c.splice(i,1)[0];if(!w.some(x=>x.productId===p.productId||x.image===p.image))w.push({productId:p.productId,name:p.name,price:p.price,image:p.image});localStorage.setItem('cart',JSON.stringify(c));localStorage.setItem('wishlist',JSON.stringify(w));render();updateKashoriaCounts?.();kashoriaToast('Saved to wishlist ♡')};window.addEventListener('storage',render);render();})();
</script><script src="js/fix-storefront.js"></script>

<script src="js/config.js"></script><script src="js/kashoria-master-v3.js"></script></body></html>
