<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | KASHORIA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="k-site-header"><a class="k-site-brand" href="index.html"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a><nav class="k-site-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a><a href="custom-order.html">Custom</a><a href="wishlist.html">Wishlist ♡ <span data-wishlist-count>0</span></a><a href="cart.html">Cart 🛒 <span data-cart-count>0</span></a><a href="login.html">Login</a></nav></header><main class="k-account"><div class="k-account-card" id="confirmation"></div></main><script src="js/store.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/kashoria-enhancements.js"></script><script src="js/kashoria-all-features.js"></script><script>const q=new URLSearchParams(location.search).get('order'),box=document.getElementById('confirmation');async function show(){if(!q){box.innerHTML='<h1>No recent order</h1><p>Start shopping to create an order.</p><a class="k-primary-btn" href="shop.html">Shop</a>';return;}try{const d=await KASHORIA_API_CLIENT.request('/api/orders/'+encodeURIComponent(q)),o=d.order;localStorage.setItem('kashoria_last_order',JSON.stringify(o));const items=(o.items||[]).map(x=>'<div class="k-summary-line"><span>'+KASHORIA_FEATURES.esc(x.product_name)+' × '+x.quantity+(x.color?' · '+KASHORIA_FEATURES.esc(x.color):'')+'</span><strong>'+KASHORIA_FEATURES.money(Number(x.unit_price)*Number(x.quantity))+'</strong></div>').join('');const wa='Hi KASHORIA! I placed order '+o.order_number+' for '+KASHORIA_FEATURES.money(o.total)+'. Please confirm my order.';box.innerHTML='<div class="eyebrow">Thank you ♡</div><h1>Order received</h1><p>Your order number is <b>'+KASHORIA_FEATURES.esc(o.order_number)+'</b>.</p><div class="k-order-details"><h3>Delivery</h3><p><b>'+KASHORIA_FEATURES.esc(o.customer_name)+'</b><br>'+KASHORIA_FEATURES.esc(o.address)+', '+KASHORIA_FEATURES.esc(o.city)+' - '+KASHORIA_FEATURES.esc(o.pincode)+'<br>☎ '+KASHORIA_FEATURES.esc(o.phone)+'</p><h3>Items</h3>'+items+'<div class="k-summary-line"><span>Discount</span><strong>'+KASHORIA_FEATURES.money(o.discount||0)+'</strong></div><div class="k-summary-line"><span>Gift wrapping</span><strong>'+KASHORIA_FEATURES.money(o.gift_wrap_fee||0)+'</strong></div><div class="k-summary-line"><span>Delivery</span><strong>'+KASHORIA_FEATURES.money(o.shipping_fee||0)+'</strong></div><div class="k-summary-total"><span>Total</span><strong>'+KASHORIA_FEATURES.money(o.total)+'</strong></div></div><div class="k-confirm-actions"><a class="k-primary-btn" href="https://wa.me/'+KASHORIA_CONFIG.whatsapp+'?text='+encodeURIComponent(wa)+'" target="_blank">Confirm on WhatsApp</a><a class="k-secondary-btn" href="track-order.html?order='+encodeURIComponent(o.order_number)+'">Track Order</a><a class="k-secondary-btn" href="shop.html">Continue Shopping</a></div>';}catch(e){box.innerHTML='<h1>Order placed</h1><p>'+KASHORIA_FEATURES.esc(e.message||'Your order was created. Please check your order number.')+'</p><a class="k-primary-btn" href="shop.html">Continue Shopping</a>';}}show();</script>
<script src="js/kashoria-master-v3.js"></script></body></html>
