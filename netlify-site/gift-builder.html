<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Your Gift | KASHORIA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></head><body>
<header class="k-site-header"><a class="k-site-brand" href="index.html"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a><nav class="k-site-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="contact.html">Contact</a><a href="custom-order.html">Custom</a><a href="wishlist.html">Wishlist ♡ <span data-wishlist-count>0</span></a><a href="cart.html">Cart 🛒 <span data-cart-count>0</span></a><a href="login.html">Login</a></nav></header>
<section class="k-page-hero"><div class="eyebrow">Made for someone special</div><h1>Build Your Gift 🎁</h1><p>Choose a handmade piece, colour and finishing touches in one place.</p></section>
<main class="k-feature-page"><div class="k-builder-grid"><section class="k-panel"><label class="k-feature-label">1. Choose a product</label><select id="gb-product" class="k-big-select"></select><div id="gb-preview" class="k-builder-preview"></div><label class="k-feature-label">2. Choose colour</label><div id="gb-colours" class="k-builder-colours"></div><input id="gb-custom" class="k-custom-input" placeholder="Custom colour (optional)"><label class="k-feature-label">3. Add a personal touch</label><textarea id="gb-note" rows="3" placeholder="Name, initials or special instructions"></textarea><label class="k-check-row"><input id="gb-wrap" type="checkbox" checked> Gift wrapping <span>+₹40</span></label><textarea id="gb-message" rows="3" maxlength="160" placeholder="Gift message for the recipient"></textarea><label class="k-feature-label">4. Quantity</label><div class="k-builder-qty"><button id="gb-minus">−</button><span id="gb-qty">1</span><button id="gb-plus">+</button></div><button id="gb-add" class="k-primary-btn" style="width:100%;margin-top:20px">Add Gift to Cart ♡</button></section><aside class="k-panel k-builder-summary"><div class="eyebrow">Your gift</div><h2 id="gb-name">Select a product</h2><p id="gb-colour-summary">As shown in product image</p><div class="k-summary-line"><span>Product</span><strong id="gb-price">₹0</strong></div><div class="k-summary-line"><span>Gift wrapping</span><strong id="gb-wrap-price">₹40</strong></div><div class="k-summary-total"><span>Estimated total</span><strong id="gb-total">₹0</strong></div><a href="cart.html" class="k-secondary-btn" style="width:100%;margin-top:12px">View Cart</a></aside></div></main>
<script src="js/store.js"></script><script src="js/cart.js"></script><script src="js/wishlist.js"></script><script src="js/kashoria-enhancements.js"></script><script src="js/kashoria-all-features.js"></script><script>
(function(){const ps=getKashoriaProducts(),sel=document.getElementById('gb-product'),colours=['As shown in product image','Lavender','Dusty Pink','Sky Blue','Sage Green','Cream'];sel.innerHTML=ps.map(p=>'<option value="'+p.id+'">'+KASHORIA_FEATURES.esc(p.name)+' — ₹'+p.price+'</option>').join('');let qty=1;function p(){return ps.find(x=>x.id===sel.value)||ps[0]}function render(){const x=p();document.getElementById('gb-preview').innerHTML='<img src="'+x.image+'" alt="'+KASHORIA_FEATURES.esc(x.name)+'">';document.getElementById('gb-name').textContent=x.name;document.getElementById('gb-price').textContent=money(x.price);document.getElementById('gb-wrap-price').textContent=document.getElementById('gb-wrap').checked?'₹40':'₹0';document.getElementById('gb-total').textContent=money(Number(x.price)*qty+(document.getElementById('gb-wrap').checked?40*qty:0));document.getElementById('gb-qty').textContent=qty;document.getElementById('gb-colours').innerHTML=colours.map((c,i)=>'<button type="button" class="gb-colour '+(i===0?'active':'')+'" data-c="'+c+'">'+c+'</button>').join('');document.querySelectorAll('.gb-colour').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gb-colour').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('gb-colour-summary').textContent=b.dataset.c});}const money=KASHORIA_FEATURES.money;sel.onchange=render;document.getElementById('gb-wrap').onchange=render;document.getElementById('gb-plus').onclick=()=>{qty++;render()};document.getElementById('gb-minus').onclick=()=>{if(qty>1)qty--;render()};document.getElementById('gb-add').onclick=()=>{const x=p(),active=document.querySelector('.gb-colour.active')?.dataset.c||'As shown in product image',custom=document.getElementById('gb-custom').value.trim(),color=custom?'Custom: '+custom:active;addToCart(x.name,x.price,x.image,qty,{productId:x.id,color,note:document.getElementById('gb-note').value.trim(),giftWrap:document.getElementById('gb-wrap').checked,giftMessage:document.getElementById('gb-message').value.trim()});location.href='cart.html'};render()})();
</script>
<script src="js/config.js"></script><script src="js/kashoria-master-v3.js"></script></body></html>
