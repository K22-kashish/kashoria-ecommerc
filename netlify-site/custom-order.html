<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Order | KASHORIA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/kashoria-upgrade.css"><link rel="stylesheet" href="css/kashoria-features.css"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></head><body><header class="k-site-header"><a class="k-site-brand" href="index.html"><img src="images/logo.png" class="k-site-logo" alt="KASHORIA"></a><nav class="k-site-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="custom-order.html">Custom</a><a href="contact.html">Contact</a><a href="wishlist.html">Wishlist ♡ <span data-wishlist-count>0</span></a><a href="cart.html">Cart 🛒 <span data-cart-count>0</span></a><a href="login.html">Login</a></nav></header><section class="k-page-hero"><div class="eyebrow">Made especially for you</div><h1>Custom Order ✨</h1><p>Tell KASHORIA what you have in mind and send a reference photo if you have one.</p></section><main class="k-feature-page"><form id="custom-form" class="k-panel k-custom-form"><div class="k-form-grid"><div class="k-form-group"><label>Your name</label><input id="cu-name" required></div><div class="k-form-group"><label>Phone / WhatsApp</label><input id="cu-phone" type="tel" required></div><div class="k-form-group full"><label>What would you like?</label><input id="cu-product" placeholder="e.g. 5-heart phone charm, bouquet, keychain" required></div><div class="k-form-group"><label>Preferred colour</label><input id="cu-color" placeholder="Dusty pink / sage green"></div><div class="k-form-group"><label>Quantity</label><input id="cu-qty" type="number" min="1" value="1"></div><div class="k-form-group"><label>Budget</label><input id="cu-budget" placeholder="e.g. ₹500"></div><div class="k-form-group full"><label>Details</label><textarea id="cu-note" rows="5" placeholder="Size, name/text, occasion, deadline and any other details..."></textarea></div><div class="k-form-group full"><label>Reference photo (optional)</label><input id="cu-photo" type="file" accept="image/jpeg,image/png,image/webp"><small>Maximum 2 MB. The image is kept in this browser and included in the WhatsApp message.</small></div></div><button class="k-order-btn" type="submit">Send Custom Request on WhatsApp 💌</button></form></main><script src="js/store.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/kashoria-enhancements.js"></script><script src="js/kashoria-all-features.js"></script><script>document.getElementById('custom-form').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('cu-photo').files?.[0];if(f&&f.size>2*1024*1024){kashoriaToast('Reference photo must be under 2 MB');return;}const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Sending…';try{const fd=new FormData();fd.append('name',document.getElementById('cu-name').value.trim());fd.append('phone',document.getElementById('cu-phone').value.trim());fd.append('email',JSON.parse(localStorage.getItem('kashoria_current_user')||'null')?.email||'');fd.append('productIdea',document.getElementById('cu-product').value.trim());fd.append('color',document.getElementById('cu-color').value.trim());fd.append('quantity',document.getElementById('cu-qty').value);fd.append('budget',document.getElementById('cu-budget').value.trim());fd.append('details',document.getElementById('cu-note').value.trim());if(f)fd.append('reference',f);const d=await KASHORIA_API_CLIENT.request('/api/features/custom-orders',{method:'POST',body:fd});const text=`Hi KASHORIA! I submitted custom request #${d.id}. Name: ${document.getElementById('cu-name').value.trim()}. Please contact me to discuss the quote.`;window.open('https://wa.me/'+KASHORIA_CONFIG.whatsapp+'?text='+encodeURIComponent(text),'_blank');e.target.reset();kashoriaToast('Custom request saved ♡');}catch(err){kashoriaToast(err.message||'Could not save custom request');}finally{btn.disabled=false;btn.textContent='Send Custom Request on WhatsApp 💌';}};</script>
<script src="js/kashoria-master-v3.js"></script></body></html>
